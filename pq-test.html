<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PQ Test – Jaké je moje dnešní PQ skóre?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:2rem 1.25rem}

/* HEADER */
.hdr{text-align:center;margin-bottom:2.5rem}
.logo{width:52px;height:52px;background:#1D9E75;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem}
.logo span{color:white;font-size:20px;font-weight:700}
h1{font-size:22px;font-weight:700;margin-bottom:.35rem;color:#111}
.sub{font-size:14px;color:#666}

/* PROGRESS */
.prog-wrap{margin-bottom:2rem}
.prog-bar{height:5px;background:#e0e0e0;border-radius:3px;overflow:hidden;margin-bottom:.4rem}
.prog-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width .3s}
.prog-label{font-size:12px;color:#888;text-align:right}

/* QUESTION CARD */
.card{background:white;border-radius:20px;padding:2rem 1.75rem;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.q-text{font-size:21px;font-weight:600;color:#111;line-height:1.4;margin-bottom:.5rem}
.q-sub{font-size:15px;color:#666;line-height:1.5;margin-bottom:2rem}

/* CHOICES */
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.choice{border:1.5px solid #e0e0e0;border-radius:12px;padding:.75rem .25rem;text-align:center;font-size:12px;color:#666;cursor:pointer;transition:all .15s;background:#fafafa;line-height:1.3;-webkit-tap-highlight-color:transparent;user-select:none}
.choice:active{transform:scale(.97)}
.choice .val{font-size:22px;font-weight:700;display:block;margin-bottom:3px;color:#333}
.choice.sel-neg{background:#FEF2F2;border-color:#E24B4A;color:#9B1C1C}
.choice.sel-neg .val{color:#E24B4A}
.choice.sel-pos{background:#ECFDF5;border-color:#1D9E75;color:#065F46}
.choice.sel-pos .val{color:#1D9E75}
@media(hover:hover){
  .choice:hover{border-color:#1D9E75;color:#1D9E75;background:#ECFDF5}
  .choice:hover .val{color:#1D9E75}
}

/* NAV */
.nav{display:flex;gap:10px;margin-top:1.25rem}
.btn{flex:1;height:48px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:1.5px solid #ddd;background:white;color:#333;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:#1D9E75;color:white;border-color:#1D9E75}
.btn-primary:active{background:#0F6E56}
.err{font-size:13px;color:#E24B4A;text-align:center;margin-top:.75rem;min-height:20px}

/* RESULT */
#screen-result{display:none}
.res-score-wrap{text-align:center;margin-bottom:2rem}
.res-score-circle{width:120px;height:120px;border-radius:50%;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:5px solid;margin-bottom:.75rem}
.res-score-num{font-size:38px;font-weight:800;line-height:1}
.res-score-pct{font-size:14px;font-weight:600}
.res-score-label{font-size:20px;font-weight:700;color:#111}

/* LADDER */
.ladder{margin-bottom:2rem}
.ladder-item{display:flex;align-items:center;gap:12px;padding:.85rem 1rem;border-radius:14px;margin-bottom:6px;background:white;border:1.5px solid transparent;transition:all .2s}
.ladder-item.active{border-width:2px}
.ladder-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.ladder-text{flex:1}
.ladder-name{font-size:14px;font-weight:600}
.ladder-range{font-size:12px;margin-top:1px}
.ladder-arrow{font-size:18px;flex-shrink:0}

/* RESULT TEXT */
.res-text-card{background:white;border-radius:20px;padding:1.75rem;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:1.5rem}
.res-text-title{font-size:16px;font-weight:700;margin-bottom:.75rem}
.res-text-body{font-size:15px;color:#444;line-height:1.8;white-space:pre-line}

/* STATS ROW */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.5rem}
.stat{background:white;border-radius:14px;padding:1rem;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.stat-label{font-size:12px;color:#888;margin-bottom:.25rem}
.stat-val{font-size:26px;font-weight:800}

.res-actions{display:flex;gap:10px;margin-bottom:1rem}
.share-box{background:white;border-radius:14px;padding:1rem;box-shadow:0 1px 6px rgba(0,0,0,.05);display:none}
.share-box p{font-size:12px;color:#888;margin-bottom:.5rem}
.share-ta{width:100%;font-size:12px;padding:.5rem;border:1px solid #e0e0e0;border-radius:8px;background:#fafafa;resize:none;font-family:monospace;color:#333}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="wrap">

<!-- TEST SCREEN -->
<div id="screen-test">
  <div class="hdr">
    <div class="logo"><span>P+</span></div>
    <h1>Jaké je moje dnešní PQ skóre?</h1>
    <p class="sub">Ohodnoťte každý pocit — jak moc ho teď prožíváte?</p>
  </div>
  <div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="prog-label" id="prog-label">0 / 20</div>
  </div>
  <div id="q-wrap"></div>
  <div class="err" id="err-msg"></div>
  <div class="nav">
    <button class="btn" id="btn-prev" onclick="prevQ()" disabled>← Zpět</button>
    <button class="btn btn-primary" id="btn-next" onclick="nextQ()">Další →</button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="screen-result">
  <div class="hdr">
    <div class="logo"><span>P+</span></div>
    <h1>Váš výsledek</h1>
  </div>

  <div class="res-score-wrap">
    <div class="res-score-circle" id="res-circle">
      <div class="res-score-num" id="res-num">–</div>
      <div class="res-score-pct">%</div>
    </div>
    <div class="res-score-label" id="res-label">–</div>
  </div>

  <div class="ladder" id="ladder"></div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Negativní součet</div>
      <div class="stat-val" id="res-neg" style="color:#E24B4A">–</div>
    </div>
    <div class="stat">
      <div class="stat-label">Pozitivní součet</div>
      <div class="stat-val" id="res-pos" style="color:#1D9E75">–</div>
    </div>
  </div>

  <div class="res-text-card">
    <div class="res-text-title" id="res-text-title">–</div>
    <div class="res-text-body" id="res-text-body">–</div>
  </div>

  <div class="res-actions">
    <button class="btn" onclick="restart()">↺ Znovu</button>
    <button class="btn" onclick="saveResult()">↓ Uložit</button>
    <button class="btn btn-primary" onclick="toggleShare()">↗ Sdílet</button>
  </div>
  <div class="share-box" id="share-box">
    <p>Zkopírujte a sdílejte svůj výsledek:</p>
    <textarea class="share-ta" id="share-ta" rows="4" readonly></textarea>
  </div>
</div>

</div>
<script>
const QS=[
  {text:"Pocit, že se musím bránit nebo ospravedlňovat.",type:"neg"},
  {text:"Zvídavost",sub:"Skutečný zájem o pochopení věcí.",type:"pos"},
  {text:"Zahořklost",sub:"Pocit křivdy vůči někomu nebo něčemu.",type:"neg"},
  {text:"Flow",sub:"Hluboké zaujetí něčím nebo někým.",type:"pos"},
  {text:"Vina",sub:"Pocit, že jsem udělal/a něco špatně.",type:"neg"},
  {text:"Soucit, empatie",sub:"Pochopení pro prožívání své i ostatních.",type:"pos"},
  {text:"Výčitky",sub:"Hluboké litování svých činů.",type:"neg"},
  {text:"Láskyplnost",sub:"Pocit náklonnosti a vřelosti.",type:"pos"},
  {text:"Pohrdání",sub:"Pocit, že někdo jiný je horší, méněcenný.",type:"neg"},
  {text:"Úžas",sub:"Pocit hlubokého respektu před něčím velkým.",type:"pos"},
  {text:"Nadřazenost",sub:"Pocit vlastní důležitosti, převahy nad ostatními.",type:"neg"},
  {text:"Údiv",sub:"Schopnost žasnout nad detaily světa, dokonalostí, krásou.",type:"pos"},
  {text:"Stres",sub:"Pocit napětí, zahlcení a přetížení.",type:"neg"},
  {text:"Hravost",sub:"Radostná a nevážná lehkost bytí.",type:"pos"},
  {text:"Obavy a strach",sub:"Pocit obav, strachu nebo úzkosti.",type:"neg"},
  {text:"Bezstarostnost",sub:"Pocit lehkosti na duši, bez tíhy, odpoutání se.",type:"pos"},
  {text:"Odpor",sub:"Silná nechuť nebo znechucení.",type:"neg"},
  {text:"Inspirace",sub:"Pocit vnitřního nabuzení a tvůrčí síly něco zkusit, dokázat, učit se.",type:"pos"},
  {text:"Nenávist nebo nepřátelství",sub:"Intenzivní nepřátelství nebo zlost.",type:"neg"},
  {text:"Povznesení",sub:"Pocit duchovní nebo emoční radosti, spočinutí.",type:"pos"},
];

const LABELS=["Vůbec","Trochu","Středně","Silně","Extrémně"];

const LEVELS=[
  {min:0,max:29,label:"Kritická úroveň PQ",range:"pod 30 %",
   color:"#C0392B",bg:"#FEF2F2",border:"#FECACA",dotColor:"#E24B4A",
   body:`Vaše mysl je momentálně silně pod vlivem kritických a negativních myšlenek. Ty generují negativní emoce a spotřebovávají velkou část vaší energie.

V této chvíli není potřeba všechno vyřešit. Zkuste se zastavit a vědomě změnit směr své pozornosti. Položte si například otázku: „Co mohu udělat, aby se tato situace posunula k lepšímu?"

I malý posun od problému směrem k řešení může otevřít prostor pro pozitivnější emoci – například zvídavost, soucit nebo naději.`},
  {min:30,max:49,label:"Nízká úroveň PQ",range:"30–49 %",
   color:"#C05621",bg:"#FFF7ED",border:"#FED7AA",dotColor:"#F97316",
   body:`Negativní myšlenky a emoce ve vašem prožívání stále výrazně převažují.

Zkuste si všimnout, na co se vaše myšlenky zaměřují. Držíte se především problému, toho, co se stalo, kdo za to může nebo co je špatně? Nebo hledáte řešení, možnosti a další krok?

Zkuste vědomě změnit směr své pozornosti: „Co s tím mohu udělat?" „Jaké mám možnosti?" „Čeho chci dosáhnout?"

A začněte si znovu všímat i drobných věcí, které jsou kolem vás dobré, příjemné nebo zajímavé. Když jsme dlouhodobě zaměřeni na problémy, snadno je přestaneme registrovat.`},
  {min:50,max:74,label:"Slabá úroveň PQ",range:"50–74 %",
   color:"#92600A",bg:"#FFFBEB",border:"#FDE68A",dotColor:"#F59E0B",
   body:`Jste blízko bodu zlomu, kdy mohou pozitivní myšlenky a emoce začít výrazněji převažovat.

Podívejte se na situaci, která vás připravuje o klid, z jiné perspektivy. Pokud je vaše pozornost zaměřená především na problém, zkuste ji přesunout k řešení: „Co mohu ovlivnit?" „Jaké mám možnosti?" „Jaký je můj další krok?"

Současně vědomě posilujte svou schopnost všímat si toho, co je kolem vás dobré. Nečekejte jen na velké důvody k radosti. Všímejte si drobných příjemných okamžiků, zajímavostí, krásy, laskavosti nebo věcí, které vám během dne přinášejí energii.`},
  {min:75,max:75,label:"Bod zlomu",range:"přesně 75 %",
   color:"#065F46",bg:"#ECFDF5",border:"#A7F3D0",dotColor:"#10B981",
   body:`Dosáhli jste bodu zlomu. Pozitivní myšlenky a emoce ve vašem prožívání převažují.

Teď je dobré tento stav vědomě posilovat. Všímejte si, co vám pomáhá zaměřovat pozornost na řešení, možnosti a cíle, a co vám dodává energii.

A nezapomínejte na malé věci. Každý den si vědomě všimněte několika drobností, které jsou dobré, příjemné, krásné nebo zajímavé. Právě to, čemu věnujeme pozornost, máme tendenci vnímat stále více.`},
  {min:76,max:100,label:"Rostoucí úroveň PQ",range:"nad 75 %",
   color:"#0F6E56",bg:"#ECFDF5",border:"#6EE7B7",dotColor:"#1D9E75",
   body:`Vaše pozitivní myšlenky a emoce nyní výrazně převažují. Máte více prostoru pro energii, kreativitu, rozhodování a spolupráci.

Pokračujte v tom, co vám funguje. Když se objeví problém, zaměřujte svou pozornost na řešení, možnosti a cíle.

A zároveň trénujte schopnost všímat si toho dobrého, co je už teď kolem vás. Drobné okamžiky radosti, krásy, zajímavosti, laskavosti nebo úspěchu snadno přehlédneme, pokud je naše pozornost automaticky zaměřená jinam.

Zkuste si každý den položit jednoduchou otázku: „Co dobrého jsem dnes zaznamenal/a, čeho bych si jindy možná ani nevšiml/a?"

To, čemu věnujeme pozornost, posilujeme.`},
];

const ans=new Array(20).fill(null);
let cur=0;

function getLevel(s){
  for(const l of LEVELS) if(s>=l.min&&s<=l.max) return l;
  return LEVELS[4];
}

function renderQ(){
  const q=QS[cur];
  const isNeg=q.type==="neg";
  const sel=ans[cur];
  document.getElementById('q-wrap').innerHTML=`
    <div class="card">
      <div class="q-text">${q.text}</div>
      ${q.sub?`<div class="q-sub">${q.sub}</div>`:'<div style="margin-bottom:2rem"></div>'}
      <div class="choices">
        ${LABELS.map((l,i)=>`
          <div class="choice ${sel===i?(isNeg?'sel-neg':'sel-pos'):''}" onclick="pick(${i})">
            <span class="val">${i}</span>${l}
          </div>`).join('')}
      </div>
    </div>`;
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('prog-fill').style.width=(done/20*100)+'%';
  document.getElementById('prog-label').textContent=`${done} / 20`;
  document.getElementById('btn-prev').disabled=cur===0;
  document.getElementById('btn-next').textContent=cur===19?'Zobrazit výsledek →':'Další →';
  document.getElementById('err-msg').textContent='';
}

function pick(v){ans[cur]=v;renderQ();}
function nextQ(){
  if(ans[cur]===null){document.getElementById('err-msg').textContent='Vyberte prosím jednu možnost.';return;}
  if(cur===19){showResult();return;}
  cur++;renderQ();
}
function prevQ(){if(cur>0){cur--;renderQ();}}

function showResult(){
  document.getElementById('screen-test').style.display='none';
  document.getElementById('screen-result').style.display='block';
  window.scrollTo(0,0);

  let neg=0,pos=0;
  QS.forEach((q,i)=>{q.type==='neg'?neg+=ans[i]||0:pos+=ans[i]||0;});
  const total=neg+pos;
  const score=total===0?0:Math.round(pos/total*100);
  const lv=getLevel(score);
  window._pq={neg,pos,score,lv};

  // score circle
  const circle=document.getElementById('res-circle');
  circle.style.borderColor=lv.color;
  circle.style.background=lv.bg;
  document.getElementById('res-num').textContent=score;
  document.getElementById('res-num').style.color=lv.color;
  document.getElementById('res-label').textContent=lv.label;

  // ladder — highest level at top
  const ladderLevels=[...LEVELS].reverse();
  document.getElementById('ladder').innerHTML=ladderLevels.map(l=>{
    const isActive=l.label===lv.label;
    return `<div class="ladder-item" style="${isActive?`background:${l.bg};border-color:${l.color};`:'background:white;border-color:#e8e8e8;opacity:.55'}">
      <div class="ladder-dot" style="background:${isActive?l.dotColor:'#ccc'}"></div>
      <div class="ladder-text">
        <div class="ladder-name" style="color:${isActive?l.color:'#888'}">${l.label}</div>
        <div class="ladder-range" style="color:${isActive?l.color:'#aaa'}">${l.range}</div>
      </div>
      ${isActive?`<div class="ladder-arrow">←</div>`:''}
    </div>`;
  }).join('');

  document.getElementById('res-neg').textContent=neg;
  document.getElementById('res-pos').textContent=pos;
  document.getElementById('res-text-title').textContent=lv.label;
  document.getElementById('res-text-title').style.color=lv.color;
  document.getElementById('res-text-body').textContent=lv.body;
}

function restart(){
  ans.fill(null);cur=0;
  document.getElementById('screen-result').style.display='none';
  document.getElementById('screen-test').style.display='block';
  document.getElementById('share-box').style.display='none';
  window.scrollTo(0,0);
  renderQ();
}

function saveResult(){
  if(!window._pq)return;
  const {neg,pos,score,lv}=window._pq;
  const now=new Date().toLocaleDateString('cs-CZ');
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const green=[29,158,117];
  const dark=[26,26,26];
  const gray=[100,100,100];
  const lightGray=[240,240,238];

  // header bar
  doc.setFillColor(...green);
  doc.rect(0,0,210,22,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(13);
  doc.setFont('helvetica','bold');
  doc.text('PQ Test – Jaké je moje dnešní PQ skóre?',105,14,{align:'center'});

  // score circle area
  doc.setFillColor(...lightGray);
  doc.roundedRect(15,28,80,42,4,4,'F');
  doc.setTextColor(...green);
  doc.setFontSize(36);
  doc.setFont('helvetica','bold');
  doc.text(score+'%',55,56,{align:'center'});
  doc.setFontSize(10);
  doc.setFont('helvetica','normal');
  doc.setTextColor(...gray);
  doc.text('PQ Skóre',55,64,{align:'center'});

  // level label
  doc.setFillColor(...lightGray);
  doc.roundedRect(100,28,95,42,4,4,'F');
  doc.setTextColor(...dark);
  doc.setFontSize(14);
  doc.setFont('helvetica','bold');
  const labelLines=doc.splitTextToSize(lv.label,82);
  doc.text(labelLines,147,46,{align:'center'});
  doc.setFontSize(9);
  doc.setFont('helvetica','normal');
  doc.setTextColor(...gray);
  doc.text(now,147,64,{align:'center'});

  // stats
  doc.setFillColor(254,242,242);
  doc.roundedRect(15,76,90,18,3,3,'F');
  doc.setTextColor(192,57,43);
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('Negativní součet',60,83,{align:'center'});
  doc.setFontSize(16);doc.setFont('helvetica','bold');
  doc.text(String(neg),60,92,{align:'center'});

  doc.setFillColor(236,253,245);
  doc.roundedRect(110,76,85,18,3,3,'F');
  doc.setTextColor(...green);
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('Pozitivní součet',152,83,{align:'center'});
  doc.setFontSize(16);doc.setFont('helvetica','bold');
  doc.text(String(pos),152,92,{align:'center'});

  // divider
  doc.setDrawColor(...green);
  doc.setLineWidth(0.5);
  doc.line(15,100,195,100);

  // recommendation text
  doc.setTextColor(...green);
  doc.setFontSize(12);doc.setFont('helvetica','bold');
  doc.text(lv.label,15,110);

  doc.setTextColor(...dark);
  doc.setFontSize(10);doc.setFont('helvetica','normal');
  doc.setLineHeightFactor(1.6);
  const bodyLines=doc.splitTextToSize(lv.body,180);
  doc.text(bodyLines,15,120);

  // footer
  doc.setFillColor(...green);
  doc.rect(0,285,210,12,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(8);doc.setFont('helvetica','normal');
  doc.text('Pozitivní bod zlomu: 75 %',105,293,{align:'center'});

  doc.save(`PQ-skore-${now.replace(/\./g,'-')}.pdf`);
}

function toggleShare(){
  const b=document.getElementById('share-box');
  if(b.style.display==='block'){b.style.display='none';return;}
  if(!window._pq)return;
  const {neg,pos,score,lv}=window._pq;
  const now=new Date().toLocaleDateString('cs-CZ');
  document.getElementById('share-ta').value=`Můj PQ skóre (${now}): ${score}%\n${lv.label}\nNegativní: ${neg} | Pozitivní: ${pos}\nBod zlomu: 75 %`;
  b.style.display='block';
  document.getElementById('share-ta').select();
}

renderQ();
</script>
</body>
</html>
